<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bipli — تتبع الطلب</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <main class="app">
    <div class="card" id="card">
      <div class="pulse" id="pulse"></div>

      <p class="label">رقم طلبك</p>
      <h1 class="order-number" id="order-number">—</h1>

      <div class="status-badge" id="status-badge">جاري التحميل…</div>
      <p class="message" id="message">يرجى الانتظار، سنقوم بإشعارك عند تجهيز طلبك</p>

      <button id="enable-sound" class="btn-enable">تفعيل الصوت والتنبيه</button>
      <button id="stop-btn" class="btn-stop" hidden>تم الاستلام ✓</button>

      <p class="hint" id="hint">لا تغلق هذه الصفحة حتى يصبح طلبك جاهزاً</p>
      <p class="brand-footer">Powered by <strong>Bipli</strong></p>
    </div>

    <div id="error-msg" class="error" hidden></div>
  </main>

  <audio id="ringtone" src="assets/ringtone.mp3" preload="auto" loop></audio>

  <script src="app.js"></script>
</body>
</html>
