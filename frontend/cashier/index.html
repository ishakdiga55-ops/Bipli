<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bipli | لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo-icon">🛎️</div>
      <h1>Bipli</h1>
    </div>
    <div class="connection-status">
      <span id="status" class="status offline">جاري الاتصال...</span>
    </div>
  </header>

  <main class="dashboard">
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-title">إجمالي الطلبات</span>
        <span class="stat-value" id="stat-total">0</span>
      </div>
      <div class="stat-card warning">
        <span class="stat-title">قيد الانتظار</span>
        <span class="stat-value"امل id="stat-waiting،">0</span>
      </div>
      <div class="stat-card success">
        <span class="stat-title">جاهز للاستلام</span>
        <span class="stat-value" id="stat-ready">0</span>
      </div>
    </section>

    <div class="layout-grid">
      <section class="card action-card">
        <div class="card-header">
          <h2>إنشاء طلب جديد</h2>
          <p>أدخل رقم الطلب لتوليد رمز الـ QR</p>
        </div>
        <form id="create-form" class="modern-form">
          <div class="input-group">
            <input type="text" id="order-number" placeholder="مثال: 42 أو A-15" required autocomplete="off" />
            <button type="submit" id="submit-btn">
              <span>توليد الـ QR</span>
            </button>
          </div>
        </form>
      </section>

      <section class="card orders-section">
        <div class="card-header">
          <h2>الطلبات النشطة</h2>
        </div>
        <div id="orders-list" class="orders-list">
          <p class="empty">لا توجد طلبات حالياً</p>
        </div>
      </section>
    </div>
  </main>

  <div class="modal-overlay" id="qr-section" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h2>امسح الكود لمتابعة الطلب</h2>
        <button id="close-qr" class="close-btn">&times;</button>
      </div>
      <div class="qr-container">
        <div class="qr-wrapper">
          <img id="qr-image" src="" alt="QR Code" style="width: 220px; height: 220px; display: block;" />
        </div>
        <div class="qr-info">
          <span class="label">رقم الطلب</span>
          <strong id="qr-order-number" class="highlight-text"></strong>
          <p class="hint">وجه العميل لمسح الكود بكاميرا هاتفه</p>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
